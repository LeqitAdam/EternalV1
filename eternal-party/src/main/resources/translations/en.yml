# --- Hotbar item -----------------------------------------------------------
item-party-head-name: "&dParty &8» &7Right-click"
item-party-head-lore: |-
  &7Open the party menu.
  &7Hit a player with it:
  &8• &7Friend &8→ &dparty invite
  &8• &7Stranger &8→ &dfriend request

