# EternalReplay - standalone replay recording + playback.

# Wie viele Sekunden vor einem captureWindow-Aufruf rueckwirkend
# gespeichert werden. Pro Spieler ~150 Bytes pro Frame, also bei 60s
# und 20 Hz ~180 KB pro Online-Spieler im RAM (vor gzip).
retention-seconds: 60

# Wie viele Server-Ticks zwischen zwei Bewegungs-Frames liegen.
# Der Minecraft-Server tickt mit 20 TPS — mehr Auflösung ist physisch
# nicht möglich, weil Position/Yaw/Pitch/Item nur einmal pro Tick
# aktualisiert werden.
#   1 tick   = 20 Hz  (Default, jeder Tick — volle Auflösung)
#   2 ticks  = 10 Hz  (halbe Auflösung, halber RAM)
#   4 ticks  = 5 Hz   (Sparmodus für sehr volle Server)
frame-interval-ticks: 1

# Wie oft ein vollstaendiger Inventar-Snapshot gemacht wird.
# 100 Ticks = alle 5 Sekunden.
inventory-snapshot-ticks: 100

# Maximale Follow-up-Dauer nach captureWindow, bevor der Recorder
# automatisch endCapture aufruft. Verhindert dass vergessene Captures
# unbegrenzt mit ihm wachsen.
max-followup-seconds: 600

# Name dieses Servers (taucht in der Replay-Metadaten auf, damit
# spaeter Cross-Server-Replays unterscheidbar sind).
server-name: lobby
