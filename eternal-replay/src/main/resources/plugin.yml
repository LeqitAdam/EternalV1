name: EternalReplay
version: ${project.version}
main: de.eternal.replay.EternalReplay
api-version: 1.19
author: Eternal
description: Standalone replay system. Records player actions and lets staff view recorded scenes via ghost entities and hotbar controls.
# ProtocolLib ist optional: wenn vorhanden, werden echte Spieler-NPCs
# mit Skin+Walking-Animation gespawnt. Sonst fallback auf ArmorStand.
softdepend: [ProtocolLib]

commands:
  replay:
    description: Diagnose und Steuerung fuer Replays.
    usage: /replay <status|list|reports|play <id>|exit>
    # Kein top-level permission — die Subcommands gaten sich selber:
    # status = eternal.replay.debug, list/reports/play/exit = eternal.replay.rewatch.

permissions:
  eternal.replay.debug:
    description: Recorder-Diagnose (/replay status).
    default: op
  eternal.replay.rewatch:
    description: Erlaubt das Ansehen gespeicherter Replays (/replay list, /replay reports, /replay play, /replay exit).
    default: op
