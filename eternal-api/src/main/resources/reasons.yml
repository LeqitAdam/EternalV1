# Eternal — alle Bann-/Mute-Gruende in einer Liste.
#
# id:       eindeutige Nummer ab 1. Luecken sind erlaubt — die ID muss nur
#           innerhalb der Liste eindeutig sein.
# type:     ban oder mute. Entscheidet, ob die Strafe ein Bann (kickt + DB)
#           oder ein Mute (blockt Chat) wird.
# label:    der Text, der im Bann-/Mute-Screen, im Broadcast und in der
#           History erscheint.
# duration: permanent | <n>s | <n>m | <n>h | <n>d | <n>w | <n>y
# permission (optional): Permission-Node, das der Ausfuehrende braucht.
#                        Default ist "eternal.ban" — oder "eternal.ban.admin",
#                        falls 'admin: true' gesetzt ist.
# groupid (optional):    CloudNet sortId/potency Mindest-Schwelle. Wer keine
#                        passende Permission hat, kommt trotzdem durch, wenn
#                        sein Tier >= dieser Wert ist. 0 = aus.
# admin (optional):      true markiert den Grund als Admin-Bann — nur
#                        eternal.ban.admin darf den Bann verhaengen, nur
#                        eternal.unban.admin darf ihn aufheben. Im
#                        Web-Interface ist der Eintrag fuer normale Mods
#                        nur lesbar.
# escalation (optional): Liste von Dauern, die je nach Anzahl
#                        vorheriger abgelaufener/aufgehobener Banns gegen
#                        denselben Grund ausgewaehlt werden. Index 0 = 1.
#                        Vergehen, Index 1 = 2., usw. Falls weniger Stufen
#                        konfiguriert sind als bereits passiert, wird der
#                        letzte Eintrag wiederholt. Ohne escalation gilt
#                        immer die 'duration' fuer jeden Vorfall.
#   escalation:
#     - 1d            # 1. Mal
#     - 7d            # 2. Mal
#     - 30d           # 3. Mal
#     - permanent     # 4. Mal und weitere
#
# Beide Commands sind synonym:
#   /ban <Spieler> <id>     /mute <Spieler> <id>
# Der Typ richtet sich nach 'type', nicht nach dem Command-Namen.

reasons:
  - id: 1
    type: ban
    label: "Hacking / Cheating"
    duration: permanent

  - id: 2
    type: ban
    label: "Griefing"
    duration: 30d

  - id: 3
    type: ban
    label: "Bug Abuse"
    duration: 14d

  - id: 4
    type: ban
    label: "Bann-Umgehung"
    duration: permanent

  - id: 5
    type: ban
    label: "Schwere Beleidigung"
    duration: 7d
    # Beispiel-Eskalation: 1. Mal 7d, 2. Mal 30d, 3. Mal permanent.
    escalation:
      - 7d
      - 30d
      - permanent

  - id: 6
    type: ban
    label: "Werbung"
    duration: 14d

  - id: 7
    type: ban
    label: "Account-Sharing"
    duration: 7d

  - id: 8
    type: ban
    label: "Scamming / Betrug"
    duration: 30d

  - id: 9
    type: ban
    label: "Teaming"
    duration: 3d

  - id: 10
    type: ban
    label: "Strafbare Inhalte"
    duration: permanent
    permission: eternal.reason.extreme

  - id: 20
    type: mute
    label: "Chat-Spam"
    duration: 1h

  - id: 21
    type: mute
    label: "Beleidigung"
    duration: 1d

  - id: 22
    type: mute
    label: "Caps-Lock"
    duration: 30m

  - id: 23
    type: mute
    label: "Provokation"
    duration: 6h

  - id: 24
    type: mute
    label: "Werbung im Chat"
    duration: 7d

  - id: 25
    type: mute
    label: "Falsche Chatsprache"
    duration: 15m

  # -------- Admin-Banns --------
  # Diese Gruende koennen nur von eternal.ban.admin gesetzt und nur von
  # eternal.unban.admin aufgehoben werden. Mods sehen den Bann in der History,
  # koennen ihn aber im Webinterface nicht entfernen.
  - id: 90
    type: ban
    label: "Server-Sabotage"
    duration: permanent
    admin: true

  - id: 91
    type: ban
    label: "Doxxing / IRL-Drohung"
    duration: permanent
    admin: true

  # Beispiel: per-Reason-Permission + groupid (CloudNet sortId / potency).
  # Wer eternal.ban.severe hat ODER ein CloudNet-Tier >= 50 hat, darf nutzen.
  # - id: 50
  #   type: ban
  #   label: "Schwerer Verstoss"
  #   duration: 30d
  #   permission: eternal.ban.severe
  #   groupid: 50

report-reasons:
  # API liest nur id+label (für /reasons-Endpoint im Web-Dashboard) — die
  # material/slot-Felder sind nur für die in-game GUI im eternal-spigot
  # relevant. Wir behalten die Felder hier konsistent für copy-paste.
  - id: hacking
    label: "Hacking / Cheating"
    material: IRON_SWORD
    slot: 0
  - id: kill-aura
    label: "KillAura / Reach"
    material: DIAMOND_SWORD
    slot: 1
  - id: anti-knockback
    label: "AntiKnockback"
    material: SHIELD
    slot: 2
  - id: x-ray
    label: "X-Ray / Ore-Cheating"
    material: DIAMOND_ORE
    slot: 3
  - id: bug-abuse
    label: "Bug Abuse / Exploit"
    material: COMMAND_BLOCK
    slot: 4
  - id: griefing
    label: "Griefing"
    material: TNT
    slot: 5
  - id: stealing
    label: "Stealing / Diebstahl"
    material: ENDER_CHEST
    slot: 6
  - id: trolling
    label: "Trolling / Stalling"
    material: SLIME_BALL
    slot: 7
  - id: teaming
    label: "Teaming / unerlaubte Zusammenarbeit"
    material: LEATHER_CHESTPLATE
    slot: 8
  - id: chat-insult
    label: "Beleidigung im Chat"
    material: WRITABLE_BOOK
    slot: 11
    category: chat
  - id: chat-spam
    label: "Spam / Caps"
    material: BELL
    slot: 13
    category: chat
  - id: advertising
    label: "Werbung / Advertising"
    material: OAK_SIGN
    slot: 15
    category: chat
  - id: skin-name
    label: "Unangemessener Skin / Name"
    material: PLAYER_HEAD
    slot: 20
  - id: account-sharing
    label: "Account-Sharing"
    material: ENDER_EYE
    slot: 22
  - id: other
    label: "Sonstiges"
    material: BOOK
    slot: 24

# Vorgefertigte Verkuerzungs-Vorlagen fuer Unban-Antraege.
# Mod waehlt eine Vorlage; die Dauer kann mit DurationParser-Syntax
# (1d, 6h, 30m, permanent) ueberschrieben werden — Sekunden-Eingabe
# wird intern umgerechnet, der Mod tippt menschenlesbar.
# message ist intern als decision_reason gespeichert (nicht user-facing).
appeal-shorten-templates:
  - id: immediate
    label: "Sofort entbannen"
    duration: 0s

  - id: 1h
    label: "Auf 1 Stunde verkuerzen"
    duration: 1h

  - id: 6h
    label: "Auf 6 Stunden verkuerzen"
    duration: 6h

  - id: 1d
    label: "Auf 1 Tag verkuerzen"
    duration: 1d

  - id: 3d
    label: "Auf 3 Tage verkuerzen"
    duration: 3d

  - id: 7d
    label: "Auf 1 Woche verkuerzen"
    duration: 7d

  - id: 14d
    label: "Auf 2 Wochen verkuerzen"
    duration: 14d

  - id: 30d
    label: "Auf 30 Tage verkuerzen"
    duration: 30d
