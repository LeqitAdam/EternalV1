# --- GDPR consent prompt -------------------------------------------------
consent-prompt: |-
  &8&m─────────────────────────────────────
  &dPrivacy &8» &fOne-time consent required
  &7
  &7Welcome &e{player}&7! Before you can play we need to process:
  &8 • &fPlayer name + UUID  &8(for punishments / reports)
  &8 • &fIP address          &8(for multi-account detection)
  &8 • &fPlay-time logs      &8(login / logout per session)
  &8 • &fChat / hit / replay recordings when reported
  &7
  &7Full privacy policy:
  &b  https://eternal.example/datenschutz
  &7
  &7Click below to accept or decline.
  &7Declining will kick you and DELETE all data we have on you
  &7(profile, login logs, CloudNet user).
  &8&m─────────────────────────────────────
consent-accepted: "{prefix}&aThanks! You can play now."
consent-not-pending: "{prefix}&7You've already accepted — nothing to do."
consent-blocked-command: "{prefix}&cPlease confirm the privacy GUI first."
# Proxy hint (BungeeCord): /eternal accept|decline is gone — consent flows
# through the GUI on the backend server.
consent-use-gui: "{prefix}&7Please use the privacy &fGUI&7 that opened automatically when you joined."

# --- Consent GUI ---
# Opened on first join. Click accept/decline; closing without picking
# re-opens the GUI immediately.
consent-gui-title: "&dPrivacy &8» &fConsent required"
consent-gui-accept-name: "&a&lAccept"
consent-gui-accept-lore: |-
  &7You agree to let us store
  &7your data as described.
  &7
  &eClick to confirm.
consent-gui-decline-name: "&c&lDecline"
consent-gui-decline-lore: |-
  &7You will be kicked and any
  &7data we already had on you
  &7will be erased (incl. CloudNet).
  &7
  &eClick to decline.
consent-gui-info-name: "&fHi &e{player}&8, &fwelcome!"
consent-gui-info-lore: |-
  &7We process:
  &8 • &fName + UUID  &8(punishments/reports)
  &8 • &fIP address   &8(multi-account check)
  &8 • &fPlay time    &8(sessions)
  &8 • &fChat/hit/replay data on reports
  &7
  &7Full policy:
  &b https://eternal.example/privacy
consent-declined-kick: |-
  &dEternal &8»

  &7You &cdeclined&7 the privacy policy.

  &7We &cdeleted&7 every piece of data we had on you (profile,
  &7login logs, CloudNet user record).

  &7If you change your mind, rejoin and accept on the next prompt.
