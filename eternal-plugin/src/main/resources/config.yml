# Eternal — Spigot Konfiguration

# Sprache: das Plugin laedt translations/<language>.yml.
# Eigene Sprache hinzufuegen: einfach eine neue Datei in plugins/Eternal/translations/
# anlegen (z.B. fr.yml) und hier eintragen.
language: de

# Wird in Reports/Logs verwendet, damit du im Netzwerk siehst, woher die
# Aktion kam.
server-name: lobby

database:
  type: h2           # H2 (lokal, eingebettet) oder MYSQL (Netzwerk). "sqlite" wird auf h2 gemappt.
  file: eternal      # H2-Datei (wird zu eternal.mv.db)

  host: 127.0.0.1
  port: 3306
  database: eternal
  username: eternal
  password: ""
  pool-size: 10

reports:
  cooldown-seconds: 30
  max-open-per-reporter: 3
  notify-online-staff: true
  teleport-on-claim: true

# Verhalten von /resethistory:
#   hard  = Eintraege werden physisch aus der DB geloescht (Default).
#   soft  = Eintraege bleiben in der DB mit hidden=1 - sind per SQL
#           wiederherstellbar, zaehlen aber nicht mehr fuer Eskalation
#           und tauchen nicht in /history auf.
history:
  reset-mode: hard

# Anbindung an die Eternal-REST-API.
# Aktiviere das nur, wenn das eternal-api-Jar laeuft. Mit dem Shared Secret
# (gleicher Wert wie in api.yml unter internal.shared-secret) bestaetigt das
# Plugin /eternal link <code> Anfragen und pollt fuer Web->Ingame-Teleports.
api:
  enabled: false
  base-url: http://localhost:7070
  shared-secret: ""
  poll-interval-seconds: 3

# CloudNet-Integration. Wird automatisch aktiviert, wenn CloudNet-CloudPerms
# auf dem Server erkannt wird (sonst still ignoriert). Mapped CloudNet-Gruppen
# auf Eternal-Permissions + Tier - identische Konfiguration auf Bungee und
# Spigot, einfach hier eintragen.
cloudnet:
  groups:
    Admin:
      tier: 100
      permissions:
        - eternal.ban
        - eternal.unban
        - eternal.mute
        - eternal.unmute
        - eternal.reportsystem
        - eternal.lookup
        - eternal.lookup.bypass
        - eternal.admin
        - eternal.notify
        - eternal.ban.admin
        - eternal.unban.admin
        - eternal.history.reset
        - eternal.modify.duration
        - eternal.modify.reason

    SrMod:
      tier: 75
      permissions:
        - eternal.ban
        - eternal.unban
        - eternal.mute
        - eternal.unmute
        - eternal.reportsystem
        - eternal.lookup
        - eternal.notify
        - eternal.modify.duration

    Mod:
      tier: 50
      permissions:
        - eternal.ban
        - eternal.mute
        - eternal.unmute
        - eternal.reportsystem
        - eternal.lookup
        - eternal.notify

    Supporter:
      tier: 25
      permissions:
        - eternal.mute
        - eternal.reportsystem
        - eternal.lookup

    default:
      tier: 0
      permissions:
        - eternal.report

# Basesystem (Teleport, Gamemode, Fly, Homes/Warps/Spawn, /sign, ...).
base:
  # Maximale Anzahl Homes pro Spieler (eternal.base.home.unlimited umgeht das).
  max-homes: 3
  # Gueltigkeit einer /tpa-Anfrage in Sekunden.
  tpa-expiry-seconds: 60
  # /back merkt sich auch die Todesposition.
  back-on-death: true
  # Default-Home-Name, wenn /sethome ohne Namen genutzt wird.
  default-home-name: home

# Chat-Log + Social-Spy. Loggt Chat/Commands in DB-Tabellen + pro-Server-Dateien
# und liefert den Report-Kontext (Nachrichten rund um eine Meldung) ans
# Web-Dashboard. Social-Spy spiegelt private Nachrichten netzwerkweit an
# eingeloggte Teammitglieder.
chatlog:
  enabled: true
  directory: "chatlogs"               # relativ zum Plugin-dataFolder
  log-chat: true
  log-commands: true
  report-context-before: 10
  report-context-after: 10
  report-context-window-seconds: 120  # wie lange gewartet wird, bevor das +after-Fenster finalisiert wird
  flush-interval-ticks: 40            # Spigot-Async-Flush-Takt (~2s)
  sensitive-commands:                 # erstes Token (ohne Slash), case-insensitive
    - "login"
    - "l"
    - "register"
    - "reg"
    - "changepassword"
    - "changepass"
    - "2fa"
    - "authme"
  socialspy-network: true

# Autonicker — ein Namensschild in der Hotbar schaltet eine zufaellige
# Name+Skin-Verkleidung an/aus; mit CloudNet wird zusaetzlich ein zufaelliger
# Nicht-Team-Rang ANGEZEIGT (der echte Rang/die Perms bleiben unangetastet —
# Stealth). Frueher ein eigenes Plugin (EternalAutonicker), jetzt Teil von
# Eternal.
autonicker:
  enabled: true

  # NETZWERK-MODUS: true = der BungeeCord-Proxy verwaltet den Nick zentral und
  # schiebt die Verkleidung (Name + Skin + Rang-Prefix) auf jeden Backend-Server
  # — so wirkt der Skin netzwerkweit und ueberlebt Server-Wechsel. false = jeder
  # Spigot-Server nickt nur lokal (Single-Server). Fuer Bungee-Netze: true auf
  # ALLEN Servern (Spigot + Proxy) setzen.
  network: false

  # Eigen-Skin (F5 + eigener Tab): auf PAPER-Backends automatisch korrekt
  # (setPlayerProfile refresht server-intern, kein Reconnect noetig). Diese
  # Option ist NUR ein Fallback fuer reines Spigot (kein Paper) MIT >=2 Servern:
  # dann kurzer Lobby-Bounce-Reconnect. Bei 1 Server / Paper: aus lassen.
  reconnect-on-nick: false

  # Hotbar-Slot (1-9) fuer das Namensschild. 5 = Mitte.
  nametag-slot: 5
  give-tag-on-join: true
  lock-tag-slot: true

  # Zufaelligen Rang ANZEIGEN (nur mit CloudNet). Aendert nie die echte Gruppe.
  randomize-rank: true
  # Ohne CloudNet: Rang/DisplayName verstecken und Default nutzen.
  hide-rank-without-cloudnet: true
  # Default-DisplayName waehrend des Nicks ({name} = der zufaellige Name).
  default-display: "&7{name}"
  # An den zufaelligen Namen 1-3 Ziffern anhaengen (z.B. "Leon4"). Standard aus —
  # sieht unrealistisch aus. Nur einschalten, wenn du Namens-Kollisionen fuerchtest.
  append-random-digits: false

  # Pool zufaelliger Namen — realistische, unauffaellige Spielernamen (kein
  # "Enderman"/"Creeper"). Frei anpassbar.
  name-pool: [Leon, Finn, Luca, Jonas, Max, Tim, Ben, Paul, Niklas, Felix, Julian, Moritz, Elias, Noah, David, Simon, Jan, Nico, Lars, Marvin, Kevin, Dennis, Robin, Fabian, Mats, Jannik, Erik, Tom, Liam, Henri]
  # Pool an Spielernamen, deren Skin kopiert wird.
  skin-pool: [Notch, jeb_, Dinnerbone, Grumm, Steve, Alex]

  # CloudNet-Raenge, aus denen der Zufallsrang gewaehlt wird. Leer lassen =
  # "alle CloudNet-Gruppen ausser protected-groups".
  nickable-groups: [player, premium]
  # Diese Raenge werden NIE als Nick-Rang vergeben (Team/YouTube schuetzen).
  protected-groups: [owner, admin, sradmin, srmod, mod, moderator, supporter, builder, developer, dev, team, staff, youtuber, youtube, yt]

# Log-Verwaltung: loescht automatisch alte Server-Log-Dateien (der logs/-Ordner
# fuellt sich mit rotierten *.log.gz). Laeuft auf Spigot UND Proxy.
log-cleanup:
  enabled: true
  directory: logs            # relativ zum Server-Ordner (Spigot + Bungee: "logs"; altes BungeeCord ggf ".")
  max-age-days: 7            # Dateien aelter als X Tage werden geloescht
  interval-minutes: 120     # wie oft aufgeraeumt wird
  patterns: ["*.log.gz", "*.log", "proxy.log.*"]   # welche Dateinamen
  keep: ["latest.log"]      # nie loeschen
