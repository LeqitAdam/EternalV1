name: Eternal
version: ${project.version}
main: de.eternal.spigot.EternalSpigot
api-version: '1.19'
author: Eternal
description: Eternal Ban-/Mute-/Report-System (Spigot)
# EternalReplay liefert die ReplayApi als Bukkit-Service. Soft-depend
# sorgt fuer korrekte Load-Reihenfolge + entfernt die Warnung
# "Loaded class ... which is not a depend or softdepend".
softdepend: [EternalReplay]

commands:
  ban:
    description: Bannt einen Spieler.
    usage: /ban <Spieler> [reason-id]
    permission: eternal.ban
  unban:
    description: Entbannt einen Spieler.
    usage: /unban <Spieler> [Grund]
    permission: eternal.unban
  mute:
    description: Mutet einen Spieler.
    usage: /mute <Spieler> [reason-id]
    permission: eternal.mute
  unmute:
    description: Entmutet einen Spieler.
    usage: /unmute <Spieler> [Grund]
    permission: eternal.unmute
  report:
    description: Reportet einen Spieler.
    usage: /report <Spieler> [reason-id] [Kommentar]
    permission: eternal.report
  # /reportsystem + /eternalreport wurden entfernt — Reports werden nur
  # noch ueber das Web-Dashboard angenommen, geschlossen, teleportiert.
  history:
    description: Zeigt Bann-/Mute-/Report-Historie eines Spielers.
    usage: /history <Spieler>
    permission: eternal.lookup
    aliases: [banhistory]
  lookup:
    description: Zeigt Infos zu einem Spieler.
    usage: /lookup <Spieler>
    permission: eternal.lookup
  resethistory:
    description: Loescht die History eines Spielers.
    usage: /resethistory <Spieler>
    permission: eternal.history.reset
  modify:
    description: Bestehenden Bann nachtraeglich aendern.
    usage: /modify <banid> setduration|setreason <wert>
  eternal:
    description: Verwaltung und Account-Link.
    usage: /eternal <reload|link <code>>
  autonick:
    description: Schaltet den Autonicker an/aus.
    usage: /autonick [on|off]
    aliases: [nick]
    permission: eternal.autonick.use
  # --- base system (teleport, gamemode, fly, homes/warps/spawn, /sign, ...) ---
  tp:        { description: Teleport., usage: '/tp <Spieler> [Ziel]', permission: eternal.base.tp }
  tphere:    { description: Hol einen Spieler zu dir., usage: '/tphere <Spieler>', permission: eternal.base.tphere }
  tppos:     { description: Teleport zu Koordinaten., usage: '/tppos <x> <y> <z> [welt]', permission: eternal.base.tppos }
  top:       { description: Teleport zum hoechsten Block., usage: '/top', permission: eternal.base.top }
  tpa:       { description: Teleport-Anfrage., usage: '/tpa <Spieler>', permission: eternal.base.tpa }
  tpahere:   { description: Bitte Spieler zu dir., usage: '/tpahere <Spieler>', permission: eternal.base.tpa }
  tpaccept:  { description: Anfrage annehmen., usage: '/tpaccept', aliases: [tpyes], permission: eternal.base.tpa }
  tpdeny:    { description: Anfrage ablehnen., usage: '/tpdeny', aliases: [tpno], permission: eternal.base.tpa }
  back:      { description: Zurueck zur letzten Position., usage: '/back', permission: eternal.base.back }
  gamemode:  { description: Spielmodus setzen., usage: '/gm <0-3> [Spieler]', aliases: [gm], permission: eternal.base.gamemode }
  fly:       { description: Flugmodus., usage: '/fly [Spieler]', permission: eternal.base.fly }
  speed:     { description: Tempo., usage: '/speed <walk|fly> <0-10> [Spieler]', permission: eternal.base.speed }
  god:       { description: Unverwundbarkeit., usage: '/god [Spieler]', permission: eternal.base.god }
  heal:      { description: Heilen., usage: '/heal [Spieler]', permission: eternal.base.heal }
  feed:      { description: Saettigen., usage: '/feed [Spieler]', permission: eternal.base.feed }
  setspawn:  { description: Spawn setzen., usage: '/setspawn', permission: eternal.base.setspawn }
  spawn:     { description: Zum Spawn., usage: '/spawn', permission: eternal.base.spawn }
  sethome:   { description: Zuhause setzen., usage: '/sethome [name]', permission: eternal.base.home }
  home:      { description: Zu Zuhause., usage: '/home [name]', permission: eternal.base.home }
  delhome:   { description: Zuhause loeschen., usage: '/delhome <name>', permission: eternal.base.home }
  homes:     { description: Home-Liste., usage: '/homes', permission: eternal.base.home }
  setwarp:   { description: Warp setzen., usage: '/setwarp <name>', permission: eternal.base.setwarp }
  warp:      { description: Zu Warp., usage: '/warp <name>', permission: eternal.base.warp }
  delwarp:   { description: Warp loeschen., usage: '/delwarp <name>', permission: eternal.base.setwarp }
  warps:     { description: Warp-Liste., usage: '/warps', permission: eternal.base.warp }
  hat:       { description: Item als Hut., usage: '/hat', permission: eternal.base.hat }
  repair:    { description: Reparieren., usage: '/repair [all]', aliases: [fix], permission: eternal.base.repair }
  more:      { description: Stack auffuellen., usage: '/more', permission: eternal.base.more }
  sign:      { description: Item signieren., usage: '/sign', permission: eternal.base.sign }
  clearinventory: { description: Inventar leeren., usage: '/ci [Spieler]', aliases: [ci, clearinv], permission: eternal.base.clearinventory }
  enderchest: { description: Enderchest., usage: '/ec [Spieler]', aliases: [ec], permission: eternal.base.enderchest }
  workbench: { description: Werkbank., usage: '/wb', aliases: [wb, craft], permission: eternal.base.workbench }
  invsee:    { description: Inventar ansehen., usage: '/invsee <Spieler>', permission: eternal.base.invsee }
  time:      { description: Zeit setzen., usage: '/time <day|night|set>', permission: eternal.base.time }
  day:       { description: Tag., usage: '/day', permission: eternal.base.time }
  night:     { description: Nacht., usage: '/night', permission: eternal.base.time }
  weather:   { description: Wetter., usage: '/weather <clear|rain|thunder>', permission: eternal.base.weather }
  broadcast: { description: Ansage., usage: '/broadcast <text>', aliases: [bc], permission: eternal.base.broadcast }
  msg:       { description: Private Nachricht., usage: '/msg <Spieler> <text>', aliases: [tell, w, whisper], permission: eternal.base.msg }
  reply:     { description: Antworten., usage: '/reply <text>', aliases: [r], permission: eternal.base.msg }
  kill:      { description: Toeten., usage: '/kill [Spieler]', permission: eternal.base.kill }
  vanish:    { description: Unsichtbar., usage: '/vanish [Spieler]', aliases: [v], permission: eternal.base.vanish }
  socialspy: { description: Private Nachrichten mitlesen., usage: '/socialspy [on|off]', aliases: [spy], permission: eternal.socialspy }

permissions:
  eternal.ban:
    description: Darf bannen.
    default: op
  eternal.ban.admin:
    description: Darf Admin-Banns verhaengen (reasons mit admin-Flag).
    default: false
  eternal.unban:
    description: Darf entbannen.
    default: op
  eternal.unban.admin:
    description: Darf Admin-Banns aufheben.
    default: false
  eternal.history.reset:
    description: Darf die History eines Spielers zuruecksetzen.
    default: false
  eternal.modify.duration:
    description: Darf die Dauer bestehender Banns anpassen.
    default: false
  eternal.modify.reason:
    description: Darf den Grund bestehender Banns umschreiben.
    default: false
  eternal.mute:
    description: Darf muten.
    default: op
  eternal.unmute:
    description: Darf entmuten.
    default: op
  eternal.report:
    description: Darf reporten.
    default: true
  eternal.reportsystem:
    description: Darf Reports bearbeiten.
    default: op
  eternal.lookup:
    description: Darf Spieler nachschlagen.
    default: op
  eternal.admin:
    description: Voller administrativer Zugriff.
    default: op
  eternal.reason.*:
    description: Darf jeden Grund nutzen.
    default: op
  eternal.notify:
    description: Empfaengt Broadcast-Nachrichten ueber Bans/Mutes.
    default: op
  eternal.report.notify:
    description: Empfaengt Broadcast wenn ein neuer Report eingereicht wird.
    default: op
  eternal.lookup.bypass:
    description: Darf jeden Spieler nachschlagen (ignoriert Tier-Schutz).
    default: op
  eternal.bypass:
    description: Umgeht den Tier-Schutz vollstaendig (z.B. fuer Owner).
    default: false
  eternal.autonick.use:
    description: Darf den Autonicker nutzen (Nick-Item + /autonick). Nur Team.
    default: op
  # --- base system ---
  eternal.base.spawn: { default: true }
  eternal.base.home: { default: true }
  eternal.base.warp: { default: true }
  eternal.base.tpa: { default: true }
  eternal.base.back: { default: true }
  eternal.base.msg: { default: true }
  eternal.base.sign: { default: true }
  eternal.base.tp: { default: op }
  eternal.base.tphere: { default: op }
  eternal.base.tppos: { default: op }
  eternal.base.top: { default: op }
  eternal.base.gamemode: { default: op }
  eternal.base.gamemode.others: { default: op }
  eternal.base.fly: { default: op }
  eternal.base.fly.others: { default: op }
  eternal.base.speed: { default: op }
  eternal.base.god: { default: op }
  eternal.base.god.others: { default: op }
  eternal.base.heal: { default: op }
  eternal.base.heal.others: { default: op }
  eternal.base.feed: { default: op }
  eternal.base.feed.others: { default: op }
  eternal.base.setspawn: { default: op }
  eternal.base.setwarp: { default: op }
  eternal.base.hat: { default: op }
  eternal.base.repair: { default: op }
  eternal.base.more: { default: op }
  eternal.base.clearinventory: { default: op }
  eternal.base.clearinventory.others: { default: op }
  eternal.base.enderchest: { default: op }
  eternal.base.enderchest.others: { default: op }
  eternal.base.workbench: { default: op }
  eternal.base.invsee: { default: op }
  eternal.base.time: { default: op }
  eternal.base.weather: { default: op }
  eternal.base.broadcast: { default: op }
  eternal.base.kill: { default: op }
  eternal.base.kill.others: { default: op }
  eternal.base.vanish: { default: op }
  eternal.base.home.unlimited: { default: op, description: Umgeht das Home-Limit. }
  # --- chat-log / social-spy ---
  eternal.socialspy:
    description: Darf private Nachrichten netzwerkweit mitlesen.
    default: op
  eternal.web.chatlogs:
    description: Darf die Chat-Logs im Web-Dashboard einsehen.
    default: op
  eternal.web.chatlogs.sensitive:
    description: Darf sensible Logs (Login/Register/Passwoerter) im Web-Dashboard einsehen.
    default: op
